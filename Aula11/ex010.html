<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Transito Brasileiro</title>
</head>
<body>
    <h1>Multas</h1>
    Velocidade : <input type="number" name="velocidade" id="velo01"> Km/H
    <input type="button" value="Verificar" id = "Verificar01" onclick="calcularVelocidade()">
    <div id="res">
      

    </div>
    <script>
        

        function calcularVelocidade(){
        var txtv = window.document.getElementById("velo01")
        var res = document.getElementById("res")
        var vel = Number(txtv.value)

        res.innerHTML = `<p> Sua velocidade atual é de <strong>${vel} Km/h</strong></p>`
       

        if(vel > 60){

        res.innerHTML += `<p> <strong> Você está multado</strong></p>`
        }
         res.innerHTML += `<p> Dirija sempre com cinto de segurança!</p>`
        }

    </script>
</body>
</html>
